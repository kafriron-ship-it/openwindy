<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenWindy — מזג אוויר חינמי</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <!-- Leaflet (open source) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- leaflet-velocity (open source) wind animation -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.0/dist/leaflet-velocity.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">Open<span>Windy</span></div>
    <select id="model-select" title="מודל תחזית"></select>
    <button id="xh-toggle" title="כוונת מרכז" class="active">⌖</button>
    <button id="route-btn" title="תכנון מסלול">🧭</button>
    <button id="fav-btn" title="מועדפים">☆</button>
    <button id="settings-btn" title="הגדרות">⚙</button>
    <form id="search-form" autocomplete="off">
      <input id="search-input" type="text" placeholder="חפש עיר או מקום…" />
      <div id="search-results"></div>
    </form>
  </header>

  <!-- Layer switcher (populated from W.overlays) -->
  <nav id="layers"></nav>

  <!-- Altitude selector -->
  <nav id="levels"></nav>

  <!-- Time slider -->
  <div id="timebar">
    <button id="play-btn" aria-label="נגן">▶</button>
    <div id="time-label">—</div>
    <input id="time-slider" type="range" min="0" max="0" value="0" step="1" />
  </div>

  <!-- Center crosshair picker (like Windy) -->
  <div id="crosshair">
    <button id="xh-readout" class="xh-readout" title="לחץ לתחזית מלאה"></button>
    <svg class="xh-mark" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="11" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
      <circle cx="22" cy="22" r="2" fill="#fff"/>
      <line x1="22" y1="2"  x2="22" y2="9"  stroke="#fff" stroke-width="1.5" opacity="0.85"/>
      <line x1="22" y1="35" x2="22" y2="42" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
      <line x1="2"  y1="22" x2="9"  y2="22" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
      <line x1="35" y1="22" x2="42" y2="22" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
    </svg>
  </div>

  <!-- Forecast side panel -->
  <aside id="panel" class="hidden">
    <button id="panel-close" aria-label="סגור">×</button>
    <button id="panel-fav" class="panel-fav hidden">☆ שמור</button>
    <div id="panel-content"></div>
  </aside>

  <!-- Settings popover -->
  <div id="settings-popover" class="hidden">
    <div class="set-group"><span>טמפרטורה</span>
      <div class="seg" id="seg-temp"><button data-v="c">°C</button><button data-v="f">°F</button></div></div>
    <div class="set-group"><span>רוח</span>
      <div class="seg" id="seg-wind"><button data-v="ms">m/s</button><button data-v="kmh">קמ"ש</button><button data-v="kt">קשר</button></div></div>
    <div class="set-webcam">
      <div class="sw-title">🎥 מצלמות (Windy Webcams)</div>
      <div class="sw-row"><input id="webcam-key" type="text" placeholder="הדבק מפתח API חינמי" />
        <button id="webcam-save">שמור</button></div>
      <a class="sw-link" href="https://www.windy.com/webcams" target="_blank" rel="noopener">איך משיגים מפתח חינמי?</a>
    </div>
    <div class="set-webcam">
      <div class="sw-title">🖥️ שרת Open-Meteo עצמאי</div>
      <div class="sw-row"><input id="om-base" type="text" placeholder="http://localhost:8080" />
        <button id="om-save">שמור</button></div>
      <div class="sw-note">מבטל את מגבלת המכסה. השאר ריק לשימוש בשרת הציבורי.</div>
    </div>
  </div>

  <!-- Favorites popover -->
  <div id="fav-popover" class="hidden"></div>

  <!-- First-run hint -->
  <div id="hint" class="hidden">
    <button id="hint-close" aria-label="סגור">×</button>
    <div class="hint-title">ברוך הבא ל-OpenWindy 👋</div>
    <div class="hint-tips">
      <span>👆 לחצו בכל מקום במפה לתחזית מלאה</span>
      <span>⏱️ גררו את פס הזמן לתחזית קדימה</span>
      <span>🗺️ בחרו שכבה למטה · גובה מימין</span>
      <span>⭐ שמרו ספוט ובחרו ספורט להתראות</span>
    </div>
  </div>

  <div id="loader" class="hidden"><div class="spinner"></div></div>
  <div id="legend"></div>

  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.0/dist/leaflet-velocity.min.js"></script>

  <!-- App -->
  <script src="js/config.js"></script>
  <script src="js/units.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/spots.js"></script>
  <script src="js/api.js"></script>
  <script src="js/field.js"></script>
  <script src="js/wind.js"></script>
  <script src="js/overlays.js"></script>
  <script src="js/route.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW:", e)));
    }
  </script>
</body>
</html>
